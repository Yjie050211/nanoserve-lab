[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nanoserve-lab"
version = "0.1.0"
description = "Reproducible LLM serving benchmarks and performance diagnostics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "PyYAML>=6.0,<7", "editables>=0.5,<1"]

[project.scripts]
nanoserve = "nanoserve_lab.cli:main"

[tool.hatch.build]
# Import hook avoids locale-decoding non-ASCII Windows paths in .pth path lines.
dev-mode-exact = true

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
